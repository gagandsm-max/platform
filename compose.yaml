# ==============================================================================
# Platform Docker Compose Specification
# Governing Specs: AGENTS.md, Platform_03_Architecture.md, Platform_04_HLD.md
# ==============================================================================

name: platform

# Shared development log rotation (Platform_13 / Platform_11 local disk protection).
# All long-running services must inherit this bound — no unlimited json-file logs.
x-logging: &platform-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  platform_net:
    driver: bridge

volumes:
  platform_pg_data:
    name: ${PLATFORM_PG_DATA_VOLUME:-platform_pg_data}
  platform_ch_data:
    name: ${PLATFORM_CH_DATA_VOLUME:-platform_ch_data}
  platform_kafka_data:
    name: ${PLATFORM_KAFKA_DATA_VOLUME:-platform_kafka_data}
  platform_valkey_data:
    name: ${PLATFORM_VALKEY_DATA_VOLUME:-platform_valkey_data}
  platform_sensor_net_spool:
    name: ${PLATFORM_SENSOR_NET_SPOOL_VOLUME:-platform_sensor_net_spool}
  platform_sensor_infra_spool:
    name: ${PLATFORM_SENSOR_INFRA_SPOOL_VOLUME:-platform_sensor_infra_spool}

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Authoritative Transactional Database
  # ----------------------------------------------------------------------------
  postgres:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_pg_password_change_in_prod}
    ports:
      - "127.0.0.1:${PLATFORM_POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-platform_app} -d $${POSTGRES_DB:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # ClickHouse: Analytical High-Volume Telemetry Database
  # ----------------------------------------------------------------------------
  clickhouse:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: platform-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-platform}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-platform_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform_dev_ch_password_change_in_prod}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${PLATFORM_CLICKHOUSE_HTTP_HOST_PORT:-28123}:8123"
      - "127.0.0.1:${PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT:-29000}:9000"
    volumes:
      - platform_ch_data:/var/lib/clickhouse
      - ./deploy/docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cpus: 2.0
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # ClickHouse one-shot replay-safety migration/verification
  # Existing volumes are migrated before Core is allowed to start.
  # ----------------------------------------------------------------------------
  clickhouse-migrate:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: platform-clickhouse-migrate
    restart: "no"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-platform}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-platform_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform_dev_ch_password_change_in_prod}
    volumes:
      - ./deploy/docker/clickhouse/migrations:/migrations:ro
    networks:
      - platform_net
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/migrations/run-all.sh"]
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Apache Kafka: Internal Streaming Backbone (KRaft mode, No Host Port)
  # ----------------------------------------------------------------------------
  kafka:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    image: apache/kafka:3.8.0
    container_name: platform-kafka
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/platform-kafka/guarded-start.sh"]
    command: []
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # No default identity: retain these outside the data volume. See migration runbook.
      CLUSTER_ID: ${PLATFORM_KAFKA_CLUSTER_ID:-}
      PLATFORM_KAFKA_STORAGE_ID: ${PLATFORM_KAFKA_STORAGE_ID:-}
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data/logs
    volumes:
      - platform_kafka_data:/var/lib/kafka/data
      - ./deploy/docker/kafka:/platform-kafka:ro
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    cpus: 2.0
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Valkey: Ephemeral State and Fast Cache
  # ----------------------------------------------------------------------------
  valkey:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    image: valkey/valkey:7.2-alpine
    container_name: platform-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-platform_dev_valkey_password_change_in_prod}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PLATFORM_VALKEY_HOST_PORT:-26379}:6379"
    volumes:
      - platform_valkey_data:/data
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD:-platform_dev_valkey_password_change_in_prod}\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Platform Core (Primary Node)
  # ----------------------------------------------------------------------------
  core:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    build:
      context: ./core
      dockerfile: Dockerfile
    image: platform-core:dev
    container_name: platform-core
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-INFO}
      CORE_NODE_ID: ${CORE_NODE_ID:-core-node-01}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_pg_password_change_in_prod}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-platform_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform_dev_ch_password_change_in_prod}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-platform_dev_valkey_password_change_in_prod}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      PLATFORM_TELEMETRY_CONSUMER_ENABLED: "true"
      PLATFORM_SENSOR_CONTROL_DEV_BOOTSTRAP_ENROLLMENT: "true"
      PLATFORM_SENSOR_CONTROL_DEV_CERT_DIR: /certs
    ports:
      - "127.0.0.1:${PLATFORM_CORE_HOST_PORT:-28443}:8443"
    volumes:
      - ./deploy/docker/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8443/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: 2.0
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Platform Core Standby (HA Profile)
  # ----------------------------------------------------------------------------
  core-standby:
    profiles: ["ha"]
    build:
      context: ./core
      dockerfile: Dockerfile
    image: platform-core:dev
    container_name: platform-core-standby
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-INFO}
      CORE_NODE_ID: core-node-02
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_pg_password_change_in_prod}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-platform_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform_dev_ch_password_change_in_prod}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-platform_dev_valkey_password_change_in_prod}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
    volumes:
      - ./deploy/docker/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8443/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: 2.0
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Platform UI (HTTPS-Only Reverse Proxy + React SPA)
  # ----------------------------------------------------------------------------
  ui:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: platform-ui:dev
    container_name: platform-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_UI_HOST_PORT:-23000}:443"
    volumes:
      - ./deploy/docker/certs:/etc/nginx/certs:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Sensor: Network Collector
  # ----------------------------------------------------------------------------
  sensor-net:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    build:
      context: ./sensor
      dockerfile: Dockerfile
    image: platform-sensor:dev
    container_name: platform-sensor-net
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_SENSOR_ID: ${SENSOR_NETWORK_ID:-sensor-net-01}
      PLATFORM_SENSOR_ROLE: NETWORK
      PLATFORM_SENSOR_CORE_ENDPOINT: https://core:8443
      PLATFORM_SENSOR_SPOOL_PATH: /var/lib/platform/sensor/spool
      PLATFORM_SENSOR_HEALTH_ADDRESS: ":8088"
      PLATFORM_SENSOR_TLS_CERT_FILE: /certs/sensor-net.crt
      PLATFORM_SENSOR_TLS_KEY_FILE: /certs/sensor-net.key
      PLATFORM_SENSOR_CA_FILE: /certs/ca.crt
      PLATFORM_SENSOR_CONFIG_VERSION: "1"
      PLATFORM_SENSOR_LOG_LEVEL: INFO
      PLATFORM_SENSOR_ENABLED_CAPABILITIES: SNMP,ICMP
      PLATFORM_SENSOR_STORAGE_WATERMARK_PERCENT: "80"
      PLATFORM_SENSOR_SCHEDULER_MAX_WORKERS: "8"
      PLATFORM_SENSOR_SCHEDULER_MAX_QUEUE_DEPTH: "16"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_ASSIGNMENTS: "64"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_JOBS: "24"
      PLATFORM_SENSOR_SCHEDULER_MAX_PAYLOAD_BYTES: "1048576"
      PLATFORM_SENSOR_SCHEDULER_DEFAULT_EXECUTION_TIMEOUT: 10s
      PLATFORM_SENSOR_SCHEDULER_SHUTDOWN_GRACE: 5s
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_ATTEMPTS: "3"
      PLATFORM_SENSOR_SCHEDULER_RETRY_INITIAL_BACKOFF: 100ms
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_BACKOFF: 2s
      PLATFORM_SENSOR_SCHEDULER_RETRY_JITTER: "0.2"
      PLATFORM_SENSOR_SCHEDULER_POOLS_JSON: '{"NETWORK_POLL":{"workers":4,"queueDepth":8},"STREAMING":{"workers":2,"queueDepth":4}}'
      PLATFORM_SENSOR_TRANSPORT_REQUEST_TIMEOUT: 10s
      PLATFORM_SENSOR_TRANSPORT_MAX_REQUEST_BYTES: "2097152"
      PLATFORM_SENSOR_TRANSPORT_MAX_RESPONSE_BYTES: "2097152"
      PLATFORM_SENSOR_UPLOAD_BATCH_RECORDS: "100"
      PLATFORM_SENSOR_UPLOAD_BATCH_BYTES: "1048576"
    volumes:
      - platform_sensor_net_spool:/var/lib/platform/sensor/spool
      - ./deploy/docker/certs/sensor-net.crt:/certs/sensor-net.crt:ro
      - ./deploy/docker/certs/sensor-net.key:/certs/sensor-net.key:ro
      - ./deploy/docker/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Sensor: Infrastructure Collector
  # ----------------------------------------------------------------------------
  sensor-infra:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    build:
      context: ./sensor
      dockerfile: Dockerfile
    image: platform-sensor:dev
    container_name: platform-sensor-infra
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_SENSOR_ID: ${SENSOR_INFRA_ID:-sensor-infra-01}
      PLATFORM_SENSOR_ROLE: INFRASTRUCTURE
      PLATFORM_SENSOR_CORE_ENDPOINT: https://core:8443
      PLATFORM_SENSOR_SPOOL_PATH: /var/lib/platform/sensor/spool
      PLATFORM_SENSOR_HEALTH_ADDRESS: ":8088"
      PLATFORM_SENSOR_TLS_CERT_FILE: /certs/sensor-infra.crt
      PLATFORM_SENSOR_TLS_KEY_FILE: /certs/sensor-infra.key
      PLATFORM_SENSOR_CA_FILE: /certs/ca.crt
      PLATFORM_SENSOR_CONFIG_VERSION: "1"
      PLATFORM_SENSOR_LOG_LEVEL: INFO
      PLATFORM_SENSOR_ENABLED_CAPABILITIES: INFRA,AGENT_INGRESS
      PLATFORM_SENSOR_STORAGE_WATERMARK_PERCENT: "80"
      PLATFORM_SENSOR_SCHEDULER_MAX_WORKERS: "8"
      PLATFORM_SENSOR_SCHEDULER_MAX_QUEUE_DEPTH: "16"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_ASSIGNMENTS: "64"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_JOBS: "24"
      PLATFORM_SENSOR_SCHEDULER_MAX_PAYLOAD_BYTES: "1048576"
      PLATFORM_SENSOR_SCHEDULER_DEFAULT_EXECUTION_TIMEOUT: 10s
      PLATFORM_SENSOR_SCHEDULER_SHUTDOWN_GRACE: 5s
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_ATTEMPTS: "3"
      PLATFORM_SENSOR_SCHEDULER_RETRY_INITIAL_BACKOFF: 100ms
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_BACKOFF: 2s
      PLATFORM_SENSOR_SCHEDULER_RETRY_JITTER: "0.2"
      PLATFORM_SENSOR_SCHEDULER_POOLS_JSON: '{"INFRA":{"workers":4,"queueDepth":8},"STREAMING":{"workers":2,"queueDepth":4}}'
      PLATFORM_SENSOR_TRANSPORT_REQUEST_TIMEOUT: 10s
      PLATFORM_SENSOR_TRANSPORT_MAX_REQUEST_BYTES: "2097152"
      PLATFORM_SENSOR_TRANSPORT_MAX_RESPONSE_BYTES: "2097152"
      PLATFORM_SENSOR_UPLOAD_BATCH_RECORDS: "100"
      PLATFORM_SENSOR_UPLOAD_BATCH_BYTES: "1048576"
    volumes:
      - platform_sensor_infra_spool:/var/lib/platform/sensor/spool
      - ./deploy/docker/certs/sensor-infra.crt:/certs/sensor-infra.crt:ro
      - ./deploy/docker/certs/sensor-infra.key:/certs/sensor-infra.key:ro
      - ./deploy/docker/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Scale Profile: Additional Network Sensor
  # ----------------------------------------------------------------------------
  sensor-net-02:
    profiles: ["scale"]
    build:
      context: ./sensor
      dockerfile: Dockerfile
    image: platform-sensor:dev
    container_name: platform-sensor-net-02
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_SENSOR_ID: sensor-net-02
      PLATFORM_SENSOR_ROLE: NETWORK
      PLATFORM_SENSOR_CORE_ENDPOINT: https://core:8443
      PLATFORM_SENSOR_SPOOL_PATH: /var/lib/platform/sensor/spool
      PLATFORM_SENSOR_HEALTH_ADDRESS: ":8088"
      PLATFORM_SENSOR_TLS_CERT_FILE: /certs/sensor-net.crt
      PLATFORM_SENSOR_TLS_KEY_FILE: /certs/sensor-net.key
      PLATFORM_SENSOR_CA_FILE: /certs/ca.crt
      PLATFORM_SENSOR_CONFIG_VERSION: "1"
      PLATFORM_SENSOR_LOG_LEVEL: INFO
      PLATFORM_SENSOR_ENABLED_CAPABILITIES: SNMP,ICMP
      PLATFORM_SENSOR_STORAGE_WATERMARK_PERCENT: "80"
      PLATFORM_SENSOR_SCHEDULER_MAX_WORKERS: "8"
      PLATFORM_SENSOR_SCHEDULER_MAX_QUEUE_DEPTH: "16"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_ASSIGNMENTS: "64"
      PLATFORM_SENSOR_SCHEDULER_MAX_TRACKED_JOBS: "24"
      PLATFORM_SENSOR_SCHEDULER_MAX_PAYLOAD_BYTES: "1048576"
      PLATFORM_SENSOR_SCHEDULER_DEFAULT_EXECUTION_TIMEOUT: 10s
      PLATFORM_SENSOR_SCHEDULER_SHUTDOWN_GRACE: 5s
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_ATTEMPTS: "3"
      PLATFORM_SENSOR_SCHEDULER_RETRY_INITIAL_BACKOFF: 100ms
      PLATFORM_SENSOR_SCHEDULER_RETRY_MAX_BACKOFF: 2s
      PLATFORM_SENSOR_SCHEDULER_RETRY_JITTER: "0.2"
      PLATFORM_SENSOR_SCHEDULER_POOLS_JSON: '{"NETWORK_POLL":{"workers":4,"queueDepth":8},"STREAMING":{"workers":2,"queueDepth":4}}'
      PLATFORM_SENSOR_TRANSPORT_REQUEST_TIMEOUT: 10s
      PLATFORM_SENSOR_TRANSPORT_MAX_REQUEST_BYTES: "2097152"
      PLATFORM_SENSOR_TRANSPORT_MAX_RESPONSE_BYTES: "2097152"
      PLATFORM_SENSOR_UPLOAD_BATCH_RECORDS: "100"
      PLATFORM_SENSOR_UPLOAD_BATCH_BYTES: "1048576"
    volumes:
      - platform_sensor_net_spool:/var/lib/platform/sensor/spool
      - ./deploy/docker/certs/sensor-net.crt:/certs/sensor-net.crt:ro
      - ./deploy/docker/certs/sensor-net.key:/certs/sensor-net.key:ro
      - ./deploy/docker/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - platform_net
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *platform-logging

  # ----------------------------------------------------------------------------
  # Analytics: Baseline Analytics Engine
  # ----------------------------------------------------------------------------
  analytics:
    profiles: ["dev", "test", "ha", "scale", "security", "dr"]
    build:
      context: ./analytics
      dockerfile: Dockerfile
    image: platform-analytics:dev
    container_name: platform-analytics
    restart: unless-stopped
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-development}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-INFO}
      CORE_URL: https://core:8443
      ANALYTICS_HEALTH_PORT: 8090
    depends_on:
      core:
        condition: service_healthy
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging: *platform-logging

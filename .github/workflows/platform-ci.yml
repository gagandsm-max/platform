name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # PRs share a stable group so superseding commits cancel stale PR checks.
  # Push/main uses run_id so a later merge cannot cancel earlier main evidence.
  group: platform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORM_CI: "1"

jobs:
  static-contracts:
    name: Static contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Remove leftover root-owned Maven target
        run: |
          set -euo pipefail
          # Persistent self-hosted workspaces may retain gitignored core/target
          # from older RW Maven binds. Drop only that tree so checkout's
          # git clean can run. Bind only core/; no prune, no worktree wipe.
          core_dir="${GITHUB_WORKSPACE}/core"
          if [ ! -d "${core_dir}" ] || [ ! -e "${core_dir}/target" ]; then
            echo "[OK] No leftover core/target in the job workspace."
            exit 0
          fi
          docker run --rm --user 0:0 --network none \
            -v "${core_dir}:/core" \
            maven:3.9.9-eclipse-temurin-21-alpine \
            rm -rf /core/target

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &install-compose
        name: Install and verify job-local Docker Compose 5.5.0
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/platform-ci-docker-cli/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --fail --location --retry 2 --silent --show-error https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 --output "$plugin_dir/docker-compose"
          printf '%s  %s\n' c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b "$plugin_dir/docker-compose" | sha256sum --check --status
          chmod 0755 "$plugin_dir/docker-compose"
          export DOCKER_CONFIG="$RUNNER_TEMP/platform-ci-docker-cli"
          compose_version=$(docker compose version --short)
          echo "Job-local Docker Compose version: $compose_version"
          test "$compose_version" = '5.5.0'
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Verify changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A clean working tree is not evidence that committed changes have no
          # whitespace defects. Never replace an unknown comparison with an
          # uncommitted-working-tree-only check.
          if [[ ! "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or malformed committed comparison SHA"
            exit 1
          fi
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" HEAD
          else
            git cat-file -e "${BASE_SHA}^{commit}" || {
              echo "::error::Required committed comparison SHA is unavailable: $BASE_SHA"
              exit 1
            }
            git diff --check "${BASE_SHA}...HEAD"
          fi

      - name: Prepare deterministic environment
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp .env.example .env
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"

          sed -i "s/^PLATFORM_CORE_HOST_PORT=.*/PLATFORM_CORE_HOST_PORT=21443/" .env
          sed -i "s/^PLATFORM_UI_HOST_PORT=.*/PLATFORM_UI_HOST_PORT=21000/" .env
          sed -i "s/^PLATFORM_POSTGRES_HOST_PORT=.*/PLATFORM_POSTGRES_HOST_PORT=21432/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=.*/PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=21123/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=.*/PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=21900/" .env
          sed -i "s/^PLATFORM_VALKEY_HOST_PORT=.*/PLATFORM_VALKEY_HOST_PORT=21379/" .env
          sed -i "s/^PLATFORM_ENV=.*/PLATFORM_ENV=ci/" .env

          cat <<EOF >> .env
          PLATFORM_PG_DATA_VOLUME=ci_${RUN_IDENTITY}_pg_data
          PLATFORM_CH_DATA_VOLUME=ci_${RUN_IDENTITY}_ch_data
          PLATFORM_KAFKA_DATA_VOLUME=ci_${RUN_IDENTITY}_kafka_data
          PLATFORM_VALKEY_DATA_VOLUME=ci_${RUN_IDENTITY}_valkey_data
          PLATFORM_SENSOR_NET_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_net_spool
          PLATFORM_SENSOR_INFRA_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_infra_spool
          EOF
          sed -i 's/^[[:space:]]*//' .env

          make certs
          docker compose config -q

      - name: Run static contract validators
        run: make test-static-contracts

      - name: Validate agent pack synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -f project_agents/tools/validate_agents.py ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              if git diff --name-only "${BASE_SHA}...HEAD" | grep -qE '^(project_agents/|\.cursor/agents/|\.agents/agents/|\.agents/skills/|\.codex/agents/|skills/)'; then
                python3 project_agents/tools/validate_agents.py
              fi
            else
              python3 project_agents/tools/validate_agents.py
            fi
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Remove leftover root-owned Maven target
        run: |
          set -euo pipefail
          core_dir="${GITHUB_WORKSPACE}/core"
          if [ ! -d "${core_dir}" ] || [ ! -e "${core_dir}/target" ]; then
            echo "[OK] No leftover core/target in the job workspace."
            exit 0
          fi
          docker run --rm --user 0:0 --network none \
            -v "${core_dir}:/core" \
            maven:3.9.9-eclipse-temurin-21-alpine \
            rm -rf /core/target

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *install-compose

      - name: Prepare environment
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp .env.example .env
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"

          sed -i "s/^PLATFORM_CORE_HOST_PORT=.*/PLATFORM_CORE_HOST_PORT=21443/" .env
          sed -i "s/^PLATFORM_UI_HOST_PORT=.*/PLATFORM_UI_HOST_PORT=21000/" .env
          sed -i "s/^PLATFORM_POSTGRES_HOST_PORT=.*/PLATFORM_POSTGRES_HOST_PORT=21432/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=.*/PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=21123/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=.*/PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=21900/" .env
          sed -i "s/^PLATFORM_VALKEY_HOST_PORT=.*/PLATFORM_VALKEY_HOST_PORT=21379/" .env
          sed -i "s/^PLATFORM_ENV=.*/PLATFORM_ENV=ci/" .env

          cat <<EOF >> .env
          PLATFORM_PG_DATA_VOLUME=ci_${RUN_IDENTITY}_pg_data
          PLATFORM_CH_DATA_VOLUME=ci_${RUN_IDENTITY}_ch_data
          PLATFORM_KAFKA_DATA_VOLUME=ci_${RUN_IDENTITY}_kafka_data
          PLATFORM_VALKEY_DATA_VOLUME=ci_${RUN_IDENTITY}_valkey_data
          PLATFORM_SENSOR_NET_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_net_spool
          PLATFORM_SENSOR_INFRA_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_infra_spool
          EOF
          sed -i 's/^[[:space:]]*//' .env

          mkdir -p "${HOME}/.m2"

      - name: Run containerized unit tests
        run: make test-unit

      - name: Run Engineering Orchestrator Phase 1 tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/engineering_orchestrator/run_tests.py

  ui-build:
    name: UI test and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Remove leftover root-owned Maven target
        run: |
          set -euo pipefail
          core_dir="${GITHUB_WORKSPACE}/core"
          if [ ! -d "${core_dir}" ] || [ ! -e "${core_dir}/target" ]; then
            echo "[OK] No leftover core/target in the job workspace."
            exit 0
          fi
          docker run --rm --user 0:0 --network none \
            -v "${core_dir}:/core" \
            maven:3.9.9-eclipse-temurin-21-alpine \
            rm -rf /core/target

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fresh lockfile install, UI tests, and build
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ui:/src:ro" \
            node:20-alpine \
            sh -lc 'cp -a /src /app && cd /app && npm ci && npm run test:unit && npm run build'

      - name: Build production UI container
        run: docker build --no-cache -t platform-ui:ci ui/

  integration-security:
    name: Integration, PostgreSQL, contract, security
    runs-on: ubuntu-24.04
    # Job ceiling remains 50 without Master approval to raise it.
    # Measured normal overnight integration ≈19m (1140s). Worst-case ≠ normal.
    # Enforceable work cutoff: 44m from job-start epoch; reserved diagnostics+cleanup
    # headroom: 6m (diagnostics ≤2 + cleanup/inventory ≤4). 44+6=50, never 60.
    # Informative hang-guards inside the work cutoff (sum ≤44, not a second ceiling):
    # setup/preload ≤6; kafka contract ≤5; kafka provision ≤3; clickhouse ≤6;
    # integration ≤12; postgres ≤4; contract ≤3; security ≤3 (=39 ≤44).
    timeout-minutes: 50
    steps:
      # Establish job-start epoch before checkout/compose/setup so the 44m work
      # cutoff accounts for earlier steps and preserves the 6m teardown reserve.
      - name: Establish hosted work cutoff with teardown reserve
        run: |
          set -euo pipefail
          job_ceiling_seconds=$((50 * 60))
          reserved_teardown_seconds=$((6 * 60))
          work_budget_seconds=$((job_ceiling_seconds - reserved_teardown_seconds))
          start_epoch=$(date +%s)
          cutoff_epoch=$((start_epoch + work_budget_seconds))
          {
            echo "PLATFORM_CI_JOB_START_EPOCH=${start_epoch}"
            echo "PLATFORM_CI_WORK_CUTOFF_EPOCH=${cutoff_epoch}"
            echo "PLATFORM_CI_RESERVED_TEARDOWN_SECONDS=${reserved_teardown_seconds}"
          } >> "$GITHUB_ENV"
          echo "Hosted timing budget: ceiling=${job_ceiling_seconds}s work_cutoff=${work_budget_seconds}s reserved_teardown=${reserved_teardown_seconds}s (normal overnight ≈1140s)."

      - name: Remove leftover root-owned Maven target
        run: |
          set -euo pipefail
          core_dir="${GITHUB_WORKSPACE}/core"
          if [ ! -d "${core_dir}" ] || [ ! -e "${core_dir}/target" ]; then
            echo "[OK] No leftover core/target in the job workspace."
            exit 0
          fi
          docker run --rm --user 0:0 --network none \
            -v "${core_dir}:/core" \
            maven:3.9.9-eclipse-temurin-21-alpine \
            rm -rf /core/target

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *install-compose

      - name: Preflight host container and port collision safety
        run: |
          set -euo pipefail
          echo "==> [Preflight 1/2] Checking normal development container collisions..."
          DEV_CONTAINERS=(
            "platform-postgres"
            "platform-clickhouse"
            "platform-clickhouse-migrate"
            "platform-kafka"
            "platform-valkey"
            "platform-core"
            "platform-core-standby"
            "platform-sensor-net"
            "platform-sensor-infra"
            "platform-analytics"
            "platform-ui"
          )
          EXISTING_CONTAINERS=$(docker ps -a --format '{{.Names}}')
          COLLISIONS=()
          for name in "${DEV_CONTAINERS[@]}"; do
            if printf '%s\n' "${EXISTING_CONTAINERS}" | grep -Fxq "${name}"; then
              COLLISIONS+=("${name}")
            fi
          done
          if [ ${#COLLISIONS[@]} -gt 0 ]; then
            echo "[ERROR] Pre-existing Platform development containers detected: ${COLLISIONS[*]}"
            echo "Refusing to start CI with existing Platform development containers."
            exit 1
          fi
          echo "[OK] No normal development container collisions detected."

          echo "==> [Preflight 2/2] Checking CI host port availability..."
          CI_PORTS=(21443 21000 21432 21123 21900 21379)
          OCCUPIED_PORTS=()
          SS_LISTENERS=$(ss -tuln)
          for port in "${CI_PORTS[@]}"; do
            if printf '%s\n' "${SS_LISTENERS}" | grep -Eq "[:.]${port}[[:space:]]"; then
              OCCUPIED_PORTS+=("${port}")
            fi
          done
          if [ ${#OCCUPIED_PORTS[@]} -gt 0 ]; then
            echo "[ERROR] Designated CI host port(s) already bound: ${OCCUPIED_PORTS[*]}"
            exit 1
          fi
          echo "[OK] All 6 CI host ports (21000-21900 range) are free."

      - name: Prepare deterministic environment and configure isolated CI runtime
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp .env.example .env
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"

          # Assign coherent CI-only ports (20000-29999, non-overlapping with dev/HA defaults)
          sed -i "s/^PLATFORM_CORE_HOST_PORT=.*/PLATFORM_CORE_HOST_PORT=21443/" .env
          sed -i "s/^PLATFORM_UI_HOST_PORT=.*/PLATFORM_UI_HOST_PORT=21000/" .env
          sed -i "s/^PLATFORM_POSTGRES_HOST_PORT=.*/PLATFORM_POSTGRES_HOST_PORT=21432/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=.*/PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=21123/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=.*/PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=21900/" .env
          sed -i "s/^PLATFORM_VALKEY_HOST_PORT=.*/PLATFORM_VALKEY_HOST_PORT=21379/" .env
          sed -i "s/^PLATFORM_ENV=.*/PLATFORM_ENV=ci/" .env

          # Assign unique run/attempt-scoped persistent volume targets
          cat <<EOF >> .env
          PLATFORM_PG_DATA_VOLUME=ci_${RUN_IDENTITY}_pg_data
          PLATFORM_CH_DATA_VOLUME=ci_${RUN_IDENTITY}_ch_data
          PLATFORM_KAFKA_DATA_VOLUME=ci_${RUN_IDENTITY}_kafka_data
          PLATFORM_VALKEY_DATA_VOLUME=ci_${RUN_IDENTITY}_valkey_data
          PLATFORM_SENSOR_NET_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_net_spool
          PLATFORM_SENSOR_INFRA_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_infra_spool
          EOF
          sed -i 's/^[[:space:]]*//' .env

          make certs

      - name: Verify safe rendered compose configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          raw = subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"],
              text=True,
          )
          cfg = json.loads(raw)

          run_identity = f"{os.environ['GITHUB_RUN_ID']}_{os.environ['GITHUB_RUN_ATTEMPT']}"
          expected_volumes = {
              f"platform_{suffix}": f"ci_{run_identity}_{suffix}"
              for suffix in ("pg_data", "ch_data", "kafka_data", "valkey_data",
                             "sensor_net_spool", "sensor_infra_spool")
          }

          volumes = cfg.get("volumes", {})
          actual_volumes = {key: value.get("name") for key, value in volumes.items()}
          if actual_volumes != expected_volumes:
              sys.exit("[ERROR] Rendered Compose volumes differ from the six exact run/attempt targets.")

          expected_ports = {"21443", "21000", "21432", "21123", "21900", "21379"}
          dev_ports = {"28443", "23000", "25432", "28123", "29000", "26379", "25442"}
          published_ports = set()
          for svc in cfg.get("services", {}).values():
              for p in svc.get("ports", []):
                  if isinstance(p, dict) and "published" in p:
                      published_ports.add(str(p["published"]))
                  elif isinstance(p, str) and ":" in p:
                      parts = p.split(":")
                      if len(parts) >= 2:
                          published_ports.add(parts[-2])

          if published_ports != expected_ports:
              print(f"[ERROR] Rendered published ports {sorted(published_ports)} != expected {sorted(expected_ports)}")
              sys.exit(1)

          overlap = published_ports & dev_ports
          if overlap:
              print(f"[ERROR] Rendered published ports overlap dev/HA ports: {sorted(overlap)}")
              sys.exit(1)

          print("[OK] Rendered Compose safety gate PASSED: 6 isolated CI volumes and 6 CI ports verified.")
          PY

      - name: Set up hosted disk checks and preload Kafka fixture images
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/platform-ci-disk" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          reserve_kib=$((2 * 1024 * 1024))
          if [[ ${1:-} == --initial ]]; then
            reserve_kib=$((8 * 1024 * 1024))
            shift
          fi
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          [[ "$docker_root" == /* ]]
          paths=("$docker_root" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp)
          if [[ -d /var/lib/containerd ]]; then
            paths+=(/var/lib/containerd)
          fi

          sample() {
            local blocks inodes
            date -u
            blocks=$(sudo -n df -Pk -- "${paths[@]}") || return 1
            inodes=$(sudo -n df -Pi -- "${paths[@]}") || return 1
            printf '%s\n' "$blocks" "$inodes"
            awk -v minimum="$reserve_kib" 'NR > 1 && $4 < minimum { bad=1 } END { exit (NR < 2 || bad) }' <<< "$blocks" &&
              awk 'NR > 1 && $4 < 16384 { bad=1 } END { exit (NR < 2 || bad) }' <<< "$inodes"
          }

          snapshot() {
            timeout 20s docker system df && sample
          }

          echo "Hosted cumulative peak capacity is UNKNOWN. Required free reserve: ${reserve_kib} KiB and 16384 inodes."
          # Enforceable aggregate work cutoff (job ceiling 50m minus reserved teardown).
          if [[ -n "${PLATFORM_CI_WORK_CUTOFF_EPOCH:-}" ]]; then
            now_epoch=$(date +%s)
            if (( now_epoch >= PLATFORM_CI_WORK_CUTOFF_EPOCH )); then
              echo "::error::Hosted work cutoff reached; reserved diagnostics/cleanup headroom must remain"
              exit 75
            fi
          fi
          snapshot || { echo "::error::Hosted disk preflight failed for $*"; exit 75; }
          # Isolate only this command's subprocess group: a failing sampler must
          # stop a blocked test rather than wait for the 50-minute job timeout.
          command -v setsid >/dev/null || { echo "::error::setsid unavailable"; exit 75; }
          # Parent-only bounded TERM→KILL reap. Sampler may signal the group but
          # must not wait on workload_pid. Never hardcode sampler_status=143.
          # `( exec setsid … ) &` makes the workload its own session/process-group
          # leader. Bare `setsid … &` keeps the launcher in this shell's group so
          # `kill -- -PGID` would TERM the disk wrapper itself.
          term_grace_seconds=${PLATFORM_CI_TERM_GRACE_SECONDS:-15}
          sampler_interval_seconds=${PLATFORM_CI_SAMPLER_INTERVAL_SECONDS:-15}
          cutoff_poll_seconds=${PLATFORM_CI_CUTOFF_POLL_SECONDS:-1}
          sampler_fail_marker="$RUNNER_TEMP/platform-ci-disk-sampler-failed.$$"
          sampler_stop_marker="$RUNNER_TEMP/platform-ci-disk-sampler-stop.$$"
          cutoff_fail_marker="$RUNNER_TEMP/platform-ci-disk-cutoff-failed.$$"
          rm -f "$sampler_fail_marker" "$sampler_stop_marker" "$cutoff_fail_marker"
          (
            exec setsid "$@"
          ) &
          workload_pid=$!
          sampler=""
          escalator=""
          cutoff_monitor=""
          process_group_alive() {
            # Process-group liveness (not PID-only): any remaining member counts.
            # Fall back to the leader PID when killpg returns ESRCH across sessions.
            kill -0 -- "-$1" 2>/dev/null || kill -0 "$1" 2>/dev/null
          }
          # kill -0 succeeds on zombies; treat zombie/self-exit as exited.
          pid_has_exited() {
            local pid="$1" state=""
            [[ -n "$pid" ]] || return 0
            if [[ -r "/proc/$pid/status" ]]; then
              state=$(awk '/^State:/ {print $2; exit}' "/proc/$pid/status" 2>/dev/null || true)
              [[ "$state" == "Z" ]] && return 0
              return 1
            fi
            ! kill -0 "$pid" 2>/dev/null
          }
          # Prevent group-start race: do not arm sampler until PGID is addressable
          # or the workload has already exited.
          group_ready_deadline=$((SECONDS + 5))
          while ! process_group_alive "$workload_pid" && ! pid_has_exited "$workload_pid"; do
            if (( SECONDS >= group_ready_deadline )); then
              echo "::error::Workload process group failed to become addressable"
              wait "$workload_pid" 2>/dev/null || true
              exit 75
            fi
            sleep 0.1
          done
          stop_workload_signal() {
            # Prefer process-group TERM; also signal the leader PID when killpg
            # returns ESRCH for a setsid session leader visible only by PID.
            kill -TERM -- "-${workload_pid}" 2>/dev/null || true
            kill -TERM "${workload_pid}" 2>/dev/null || true
          }
          publish_sampler_failure() {
            # Sticky failure BEFORE TERM. Parent observes even if sampler still live
            # and the workload traps TERM to exit 0.
            printf '%s\n' "${1:-1}" > "$sampler_fail_marker"
          }
          publish_cutoff_failure() {
            # Sticky aggregate-deadline failure BEFORE TERM. A workload that traps
            # TERM and exits 0 must still fail closed once the work cutoff is crossed.
            printf '%s\n' "${1:-75}" > "$sampler_fail_marker"
            printf 'cutoff\n' > "$cutoff_fail_marker"
          }
          work_cutoff_reached() {
            [[ -n "${PLATFORM_CI_WORK_CUTOFF_EPOCH:-}" ]] || return 1
            local now_epoch
            now_epoch=$(date +%s)
            (( now_epoch >= PLATFORM_CI_WORK_CUTOFF_EPOCH ))
          }
          mark_sampler_stop_intentional() {
            printf 'stop\n' > "$sampler_stop_marker"
          }
          reap_workload_group() {
            local rc=0 deadline
            stop_workload_signal
            deadline=$((SECONDS + term_grace_seconds))
            while process_group_alive "$workload_pid"; do
              if (( SECONDS >= deadline )); then
                echo "::warning::Workload process group ignored SIGTERM; sending SIGKILL"
                kill -KILL -- "-${workload_pid}" 2>/dev/null || true
                kill -KILL "${workload_pid}" 2>/dev/null || true
                sleep 1
                break
              fi
              sleep 1
            done
            wait "$workload_pid" 2>/dev/null || rc=$?
            if process_group_alive "$workload_pid"; then
              echo "::error::Workload process group still alive after TERM/KILL reap"
              return 75
            fi
            return "$rc"
          }
          stop_helper_pid() {
            local pid="$1"
            [[ -n "$pid" ]] || return 0
            # Owned helper only: children of this pid, then the helper itself.
            pkill -KILL -P "$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          cancel_workload() {
            # Ignore further INT/TERM so restoring default cannot redeliver the
            # original SIGTERM and kill this shell before exit 130 / reap completes.
            trap '' INT TERM
            mark_sampler_stop_intentional
            stop_helper_pid "${cutoff_monitor:-}"
            cutoff_monitor=""
            stop_helper_pid "${escalator:-}"
            escalator=""
            stop_helper_pid "${sampler:-}"
            sampler=""
            reap_workload_group || true
            echo "::error::Hosted test command cancelled"
            exit 130
          }
          trap cancel_workload INT TERM
          (
            while sleep "$sampler_interval_seconds"; do
              if ! sample; then
                echo "::error::Hosted free-space/inode reserve crossed or measurement failed during $*"
                publish_sampler_failure 1
                stop_workload_signal
                exit 1
              fi
            done
          ) &
          sampler=$!
          # Signal-only escalator: if sampler dies and the workload ignores TERM,
          # escalate to KILL. Parent alone waits on workload_pid (no double-wait).
          (
            while ! pid_has_exited "$sampler"; do
              process_group_alive "$workload_pid" || exit 0
              sleep 1
            done
            process_group_alive "$workload_pid" || exit 0
            deadline=$((SECONDS + term_grace_seconds))
            while process_group_alive "$workload_pid"; do
              if (( SECONDS >= deadline )); then
                echo "::warning::Workload process group ignored SIGTERM; sending SIGKILL"
                kill -KILL -- "-${workload_pid}" 2>/dev/null || true
                kill -KILL "${workload_pid}" 2>/dev/null || true
                exit 0
              fi
              sleep 1
            done
          ) &
          escalator=$!
          # Active aggregate deadline monitor: enforce cutoff during work while the
          # parent keeps a real wait (cancel/reap path must not become a zombie with
          # live setsid children holding stdout pipes). Sticky publish before TERM so
          # a TERM→0 trap cannot green past the reserved teardown window.
          if [[ -n "${PLATFORM_CI_WORK_CUTOFF_EPOCH:-}" ]]; then
            (
              while ! pid_has_exited "$workload_pid"; do
                if work_cutoff_reached; then
                  echo "::error::Hosted work cutoff reached during active command; reserved diagnostics/cleanup headroom must remain"
                  publish_cutoff_failure 75
                  stop_workload_signal
                  deadline=$((SECONDS + term_grace_seconds))
                  while process_group_alive "$workload_pid"; do
                    if (( SECONDS >= deadline )); then
                      echo "::warning::Workload process group ignored SIGTERM; sending SIGKILL"
                      kill -KILL -- "-${workload_pid}" 2>/dev/null || true
                      kill -KILL "${workload_pid}" 2>/dev/null || true
                      break
                    fi
                    sleep 1
                  done
                  exit 0
                fi
                sleep "$cutoff_poll_seconds"
              done
            ) &
            cutoff_monitor=$!
          fi

          status=0
          sampler_status=0
          sampler_failed=0
          sticky_rc=""
          wait "$workload_pid" || status=$?

          # Teardown helpers without delivering SIGTERM to this shell's group.
          trap - INT TERM
          stop_helper_pid "${cutoff_monitor:-}"
          cutoff_monitor=""
          stop_helper_pid "${escalator:-}"
          escalator=""
          if [[ -f "$sampler_fail_marker" ]]; then
            sampler_failed=1
            sticky_rc=$(tr -cd '0-9' < "$sampler_fail_marker" | head -c 3 || true)
            [[ -n "$sticky_rc" ]] || sticky_rc=1
          fi
          if [[ -n "${sampler:-}" ]]; then
            if pid_has_exited "$sampler"; then
              wait "$sampler" 2>/dev/null || sampler_status=$?
              sampler=""
              # Unexpected sampler exit without intentional-stop mark is a failure.
              if [[ ! -f "$sampler_stop_marker" ]]; then
                sampler_failed=1
              fi
            elif [[ -f "$sampler_fail_marker" ]]; then
              # Sticky failure already published; bounded join then owned reap.
              join_deadline=$((SECONDS + term_grace_seconds))
              while ! pid_has_exited "$sampler"; do
                if (( SECONDS >= join_deadline )); then
                  break
                fi
                sleep 1
              done
              if pid_has_exited "$sampler"; then
                wait "$sampler" 2>/dev/null || sampler_status=$?
              else
                stop_helper_pid "$sampler"
                # Reap artifact (137/143) must not erase sticky disk-failure code.
                sampler_status=${sticky_rc:-1}
              fi
              sampler=""
              sampler_failed=1
            else
              # Intentional post-workload shutdown — not a disk-sampler failure.
              mark_sampler_stop_intentional
              stop_helper_pid "$sampler"
              sampler=""
            fi
          fi
          if process_group_alive "$workload_pid"; then
            echo "::warning::Workload leader waited but process group still live; escalating"
            kill -KILL -- "-${workload_pid}" 2>/dev/null || true
            kill -KILL "${workload_pid}" 2>/dev/null || true
            sleep 1
            if process_group_alive "$workload_pid"; then
              echo "::error::Workload process group still alive after TERM/KILL reap"
              (( status != 0 )) || status=75
            fi
          fi

          # Check after the command even when it failed. Preserve primary status.
          observed=0
          snapshot || observed=$?
          if (( sampler_failed != 0 )); then
            # Prefer sticky failure over helper-reap 137/143; never invent success.
            if [[ -n "${sticky_rc:-}" && "$sticky_rc" != 0 ]]; then
              if (( sampler_status == 0 || sampler_status == 137 || sampler_status == 143 )); then
                sampler_status=$sticky_rc
              fi
            fi
            (( sampler_status != 0 )) || sampler_status=1
            if [[ -f "$cutoff_fail_marker" ]]; then
              echo "::error::Hosted work cutoff enforced for $* (exit=${sampler_status})"
            else
              echo "::error::Hosted disk sampler failed for $* (exit=${sampler_status})"
            fi
            (( status != 0 )) || status=$sampler_status
            (( status != 0 )) || status=75
          fi
          if (( observed != 0 )); then
            echo "::error::Hosted disk check failed for $*"
            (( status != 0 )) || status=75
          fi
          rm -f "$sampler_fail_marker" "$sampler_stop_marker" "$cutoff_fail_marker"
          exit "$status"
          BASH
          chmod 0755 "$RUNNER_TEMP/platform-ci-disk"
          "$RUNNER_TEMP/platform-ci-disk" --initial bash -e -c '
            docker pull node:20-alpine
            docker pull apache/kafka:3.8.0
            docker image inspect --format "{{.Id}} {{json .RepoDigests}}" node:20-alpine apache/kafka:3.8.0
          '

      - name: Prove isolated guarded Kafka storage contract
        run: '"$RUNNER_TEMP/platform-ci-disk" ./tests/run-kafka-storage-contract-test.sh'

      - name: Explicitly provision fresh run-scoped Kafka storage
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "${PLATFORM_CI_WORK_CUTOFF_EPOCH:-}" ]]; then
            now_epoch=$(date +%s)
            if (( now_epoch >= PLATFORM_CI_WORK_CUTOFF_EPOCH )); then
              echo "::error::Hosted work cutoff reached; reserved diagnostics/cleanup headroom must remain"
              exit 75
            fi
            remaining=$((PLATFORM_CI_WORK_CUTOFF_EPOCH - now_epoch))
          else
            remaining=180
          fi
          # Informative hang-guard ≤3m inside the aggregate work cutoff.
          (( remaining > 180 )) && remaining=180
          (( remaining > 0 )) || { echo "::error::Hosted work cutoff reached; reserved diagnostics/cleanup headroom must remain"; exit 75; }
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"
          EXPECTED_VOLUME="ci_${RUN_IDENTITY}_kafka_data"
          grep -Fxq "PLATFORM_KAFKA_DATA_VOLUME=${EXPECTED_VOLUME}" .env
          # Never adopt an existing volume, including a partial earlier attempt.
          if docker volume inspect "${EXPECTED_VOLUME}" >/dev/null 2>&1; then
            echo "[ERROR] Fresh CI Kafka volume already exists; refusing provisioning."
            exit 1
          fi
          timeout "${remaining}s" bash -euo pipefail -c '
            CLUSTER_ID=$(docker run --rm --network none --tmpfs /etc/kafka/secrets \
              --tmpfs /mnt/shared/config --tmpfs /var/lib/kafka/data --entrypoint /bin/bash apache/kafka:3.8.0 \
              -c "/opt/kafka/bin/kafka-storage.sh random-uuid")
            [[ "${CLUSTER_ID}" =~ ^[A-Za-z0-9_-]{22}$ ]]
            STORAGE_ID="ci_'"${RUN_IDENTITY}"'_kafka_identity"
            printf "\nPLATFORM_KAFKA_CLUSTER_ID=%s\nPLATFORM_KAFKA_STORAGE_ID=%s\n" \
              "${CLUSTER_ID}" "${STORAGE_ID}" >> .env
            printf "COMPOSE_FILE=compose.yaml:compose.kafka-guarded.yaml\nCOMPOSE_PROJECT_NAME=ci_%s\n" \
              "'"${RUN_IDENTITY}"'" >> .env
            PLATFORM_KAFKA_NEW_VOLUME_CONFIRM="${STORAGE_ID}" \
              bash deploy/docker/kafka/deployment-preflight.sh provision
            bash deploy/docker/kafka/deployment-preflight.sh check
          '

      - name: Prove ClickHouse legacy upgrade and replay-safe canonical reads
        env:
          # Routing marker for #344 hosted-ci fixture profile. Not isolation proof;
          # external verified GitHub-hosted VM admission remains the authority.
          AMRUDAI_REPLAY_RUNTIME_PROFILE: hosted-ci
        run: '"$RUNNER_TEMP/platform-ci-disk" make test-clickhouse-replay-migration'

      - name: Run 20-test integration suite
        run: '"$RUNNER_TEMP/platform-ci-disk" make test-integration'

      - name: Run mandatory PostgreSQL suite
        run: '"$RUNNER_TEMP/platform-ci-disk" ./tests/run-core-day02-tests.sh'

      - name: Run API and data contract suite
        run: '"$RUNNER_TEMP/platform-ci-disk" make test-contract'

      - name: Run security smoke suite
        run: '"$RUNNER_TEMP/platform-ci-disk" make test-security-smoke'

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP/platform-ci-docker-cli" ]] || exit 0
          # Bounded diagnostics inside the reserved teardown window (≤2m).
          timeout 60s docker compose ps || true
          timeout 60s docker compose logs --no-color --tail=250 || true

      - name: Clean CI stack
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # CI-only disposable fixture cleanup. Production preflight has no volume-rm path.
          # Interrupted cleanup is positively owned and fails closed (never silent success).
          cleanup_interrupted() {
            echo "::error::Owned CI Kafka/stack cleanup interrupted; failing closed"
            exit 75
          }
          trap cleanup_interrupted INT TERM
          [[ "${GITHUB_ACTIONS:-}" == "true" ]] || { echo "[ERROR] Kafka volume cleanup requires GitHub Actions."; exit 1; }
          [[ "${RUN_ID}" =~ ^[0-9]+$ && "${RUN_ATTEMPT}" =~ ^[0-9]+$ ]] || exit 1
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"
          PROJECT="ci_${RUN_IDENTITY}"
          KAFKA_VOLUME="ci_${RUN_IDENTITY}_kafka_data"
          KAFKA_STORAGE="ci_${RUN_IDENTITY}_kafka_identity"
          # Read-only proof of canonical stack teardown.
          verify_teardown() {
            containers=$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT")
            networks=$(docker network ls -q --filter "label=com.docker.compose.project=$PROJECT")
            volumes=$(docker volume ls --format '{{.Name}}')
            if [[ -n "$containers" || -n "$networks" ]] ||
               grep -Eq "^${PROJECT}_(kafka_data|pg_data|ch_data|valkey_data|sensor_net_spool|sensor_infra_spool)$" <<< "$volumes"; then
              echo "::error::Run-owned Compose resources remain for $PROJECT"
              exit 1
            fi
          }
          # Ambiguous/unproven ownership: .env declares a different project than this
          # run identity. Never mutate or volume-delete by fallback.
          if [[ -f .env ]] && grep -Eq '^COMPOSE_PROJECT_NAME=' .env \
            && ! grep -Fxq "COMPOSE_PROJECT_NAME=${PROJECT}" .env; then
            echo "::error::Ambiguous/unproven Compose project ownership; refusing cleanup mutation"
            exit 1
          fi
          if ! grep -Fxq "COMPOSE_PROJECT_NAME=${PROJECT}" .env 2>/dev/null; then
            echo "Canonical provisioning marker absent; verify residuals only (no volume-delete fallback)."
            verify_teardown
            trap - INT TERM
            exit 0
          fi
          [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP/platform-ci-docker-cli" ]] || exit 1
          grep -Fxq "PLATFORM_KAFKA_DATA_VOLUME=${KAFKA_VOLUME}" .env || exit 1
          # Bound cleanup inside reserved teardown (≤4m); leave headroom for inventory.
          cleanup_budget=${PLATFORM_CI_RESERVED_TEARDOWN_SECONDS:-360}
          (( cleanup_budget > 240 )) && cleanup_budget=240
          (( cleanup_budget > 0 )) || cleanup_budget=240
          timeout "${cleanup_budget}s" bash -euo pipefail -c '
            PROJECT="'"${PROJECT}"'"
            KAFKA_VOLUME="'"${KAFKA_VOLUME}"'"
            KAFKA_STORAGE="'"${KAFKA_STORAGE}"'"
            RUN_IDENTITY="'"${RUN_IDENTITY}"'"
            # Non-deleting host gate only; never call a production cleanup/volume-rm action.
            bash deploy/docker/kafka/deployment-preflight.sh down
            # Kafka volume: positive disposable provenance = this Actions run identity +
            # exact ownership labels + no remaining attachments. Matching STORAGE alone
            # is not deletion authorization.
            if docker volume inspect "${KAFKA_VOLUME}" >/dev/null 2>&1; then
              [[ "${KAFKA_VOLUME}" =~ ^ci_[0-9]+_[0-9]+_kafka_data$ ]] || exit 1
              kafka_labels=$(docker volume inspect -f "{{index .Labels \"issue223.owner\"}}|{{index .Labels \"platform.kafka.project\"}}|{{index .Labels \"platform.kafka.storage-id\"}}|{{index .Labels \"platform.kafka.resource\"}}" "${KAFKA_VOLUME}")
              [[ "${kafka_labels}" == "${PROJECT}|${PROJECT}|${KAFKA_STORAGE}|platform_kafka_data" ]] || exit 1
              users=$(docker ps -aq --filter "volume=${KAFKA_VOLUME}") || exit 1
              [[ -z "$users" ]] || exit 1
              docker volume rm "${KAFKA_VOLUME}"
            fi
            # Non-Kafka CI volumes: exact Compose project/volume provenance + no attachments.
            for pair in platform_pg_data:pg_data platform_ch_data:ch_data \
                platform_valkey_data:valkey_data platform_sensor_net_spool:sensor_net_spool \
                platform_sensor_infra_spool:sensor_infra_spool; do
              resource=${pair%%:*}; volume="ci_${RUN_IDENTITY}_${pair#*:}"
              if docker volume inspect "$volume" >/dev/null 2>&1; then
                labels=$(docker volume inspect -f "{{index .Labels \"com.docker.compose.project\"}}|{{index .Labels \"com.docker.compose.volume\"}}" "$volume")
                [[ "$labels" == "$PROJECT|$resource" ]] || exit 1
                users=$(docker ps -aq --filter "volume=$volume") || exit 1
                [[ -z "$users" ]] || exit 1
                docker volume rm "$volume"
              fi
            done
          '
          verify_teardown
          trap - INT TERM

      - name: Record hosted disk and Docker inventory after cleanup
        if: always()
        run: |
          df -h
          df -i
          timeout 20s docker system df
          docker ps -a --format '{{.Names}}'
          docker network ls
          docker volume ls

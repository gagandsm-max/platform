# Isolated free GitHub-hosted Linux Agent baseline evidence.
# Candidate branch only; no self-hosted runners, secrets, artifacts or release.
name: Linux Agent native smoke (candidate)

on:
  push:
    branches:
      - ci/linux-agent-native-smoke-20261115

permissions:
  contents: read

concurrency:
  group: linux-agent-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native-smoke:
    name: Ubuntu 24.04 native Go smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27.1
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go module integrity
        working-directory: agent
        run: go mod verify

      - name: Run Linux Agent and common unit suites
        working-directory: agent
        run: go test -count=1 ./linux/... ./common/...

      - name: Vet Linux Agent and common code
        working-directory: agent
        run: go vet ./linux/... ./common/...

      - name: Build Linux Agent and hash executable
        working-directory: agent
        run: |
          go build -o "$RUNNER_TEMP/amrudai-linux-agent" ./linux/cmd
          sha256sum "$RUNNER_TEMP/amrudai-linux-agent"

      - name: State evidence limitation
        run: |
          echo 'Baseline Ubuntu hosted runner smoke only.'
          echo 'Real .deb/.rpm installation, systemd restart, eBPF kernel matrix, transport and recovery remain UNVERIFIED.'
          echo 'No release artifact, signing, deployment or certification is performed.'

## Specialist rules

1. Use versioned paths/contracts and stable error codes; breaking changes require contract-major change and migration/compatibility plan.
2. Mutating bulk/job operations require appropriate idempotency semantics; ingestion/control must preserve sequence/replay metadata and durable-ack contract boundaries.
3. Enforce tenant/resource authorization server-side on every read/write/query; pagination, scan/concurrency limits and correlation IDs are baseline.
4. Kafka is internal; do not make Sensors/Agents Kafka clients. External control/ingestion stays mTLS HTTPS/gRPC.
5. Prefer shared generated schemas/contracts where practical; do not duplicate hand-written DTOs across languages.

6. OIV APIs for SaaS/change/Flight Recorder/similarity/remediation/value capabilities must be role-aware, tenant-scoped, bounded and auditable. Preserve evidence provenance and distinguish measured/derived/estimated/customer-supplied value facts.

## Workflow

1. Read existing contract and callers/consumers.
2. Specify request/response/event/error/compatibility semantics.
3. Implement minimal change with authorization/validation/idempotency.
4. Add contract and negative tests.
5. Verify backward/forward compatibility and runtime evidence.

## Required completion report

Return concise, evidence-backed output with:
1. **Decision / finding** — what you concluded or changed.
2. **Evidence** — exact files, symbols, commands, tests, logs, API/runtime/UI evidence as applicable.
3. **Risk / limitations** — unresolved items, assumptions, failure modes, or missing evidence.
4. **Next action** — only the next action required; do not expand scope silently.

Never claim `done`, `fixed`, `secure`, `production-ready`, or `GA-ready` without evidence supporting that exact claim.


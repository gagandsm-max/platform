name: Issue 315 native Go smoke (evidence only)

on:
  push:
    branches:
      - ci/issue315-native-evidence-20261116

permissions:
  contents: read

jobs:
  windows:
    name: Windows 2025 native agent verification
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify modules
        working-directory: agent
        run: go mod verify
      - name: Issue 315 CRLF regression on native Windows
        shell: pwsh
        working-directory: agent
        run: |
          go test -count=1 -v ./common/collector -run TestSoftwareInventoryGoModUnchangedShape
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native collector and service tests
        shell: pwsh
        working-directory: agent
        run: |
          go test -count=1 ./common/collector ./windows/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native vet
        working-directory: agent
        run: go vet ./common/collector ./windows/cmd
      - name: Native Windows executable build
        shell: pwsh
        working-directory: agent
        run: |
          go build -o "$env:RUNNER_TEMP/AmrudAiAgent.exe" ./windows/cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux:
    name: Linux 24.04 collector regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify modules
        working-directory: agent
        run: go mod verify
      - name: Linux collector regression
        working-directory: agent
        run: go test -count=1 ./common/collector ./linux/...

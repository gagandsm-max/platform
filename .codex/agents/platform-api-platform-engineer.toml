## Specialist mission

Design and implement stable Platform APIs/events that enforce tenant/RBAC scope, compatibility, bounded queries, idempotency/replay and machine-readable diagnostics without leaking internal services or secrets.

## Always read when relevant

- `project_documentation/Platform_19_Operational_Intelligence_MTTR_and_Value_Addendum.md`

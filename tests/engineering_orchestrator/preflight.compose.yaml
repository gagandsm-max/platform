# Disposable test runner only; no product runtime or privileged CI authority.
services:
  preflight-tests:
    build:
      context: ../..
      dockerfile: tests/engineering_orchestrator/preflight.Dockerfile
    network_mode: none
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    volumes:
      - ../..:/workspace:ro
    command: [python3, tests/engineering_orchestrator/run_tests.py]
  # Explicit operator-run read-only private-source probe, never default CI.
  # Mount only the installed CLI. The trusted launcher pipes authentication
  # through stdin; never mount a desktop keyring, DBus socket or credential file.
  preflight-live-source:
    extends: preflight-tests
    profiles: [live-source]
    network_mode: bridge
    user: "${PREFLIGHT_UID:-1000}:${PREFLIGHT_GID:-1000}"
    environment:
      HOME: /tmp
      GH_CONFIG_DIR: /tmp/unconfigured-gh
    volumes:
      - /usr/bin/gh:/usr/bin/gh:ro
    command: [python3, -B, -m, tests.engineering_orchestrator.test_task_preflight, --live-source-probe]

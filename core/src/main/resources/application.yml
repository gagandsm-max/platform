server:
  port: 8443
  shutdown: graceful
  ssl:
    enabled: true
    key-store: ${CORE_KEYSTORE_PATH:file:/certs/core-keystore.p12}
    key-store-password: ${CORE_KEYSTORE_PASSWORD:platform_dev_keystore_pass}
    key-store-type: PKCS12
    key-alias: core
    trust-store: ${CORE_TRUSTSTORE_PATH:file:/certs/core-truststore.p12}
    trust-store-password: ${CORE_TRUSTSTORE_PASSWORD:platform_dev_truststore_pass}
    trust-store-type: PKCS12
    client-auth: want

spring:
  application:
    name: platform-core
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${POSTGRES_USER:platform_app}
    password: ${POSTGRES_PASSWORD:platform_dev_pg_password_change_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${VALKEY_HOST:valkey}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:platform_dev_valkey_password_change_in_prod}
      timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        transaction.timeout.ms: 30000
      # Standalone transactional publication prefix for atomic batch publication.
      # Note: Two-Core HA transaction prefix coordination is an unresolved P0 design spike.
      transaction-id-prefix: ${SPRING_KAFKA_PRODUCER_TRANSACTION_ID_PREFIX:tx-telemetry-}
    consumer:
      group-id: platform-core-group
      auto-offset-reset: earliest
      # Issue #222: transactional producer requires read_committed; manual ACK requires no auto-commit.
      # IngestionKafkaConfiguration re-pins these after binding so hostile overrides cannot weaken them.
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        # Public probe chain permits only exact health/liveness/readiness. Keep exposure minimal.
        include: health
  endpoint:
    health:
      # Anonymous probes must not dump datastore/component internals. /api/v1/health/connectivity
      # is not a public probe; it requires authentication and Platform authorization (default-deny).
      show-details: never
      probes:
        enabled: true

platform:
  node-id: ${CORE_NODE_ID:core-node-01}
  version: ${PLATFORM_VERSION:0.1.0-dev}
  kafka:
    batch-publish-deadline-seconds: ${PLATFORM_KAFKA_BATCH_PUBLISH_DEADLINE_SECONDS:20}
  migrations:
    enabled: ${PLATFORM_MIGRATIONS_ENABLED:true}
  clickhouse:
    host: ${CLICKHOUSE_HOST:clickhouse}
    port: ${CLICKHOUSE_HTTP_PORT:8123}
    user: ${CLICKHOUSE_USER:platform_app}
    password: ${CLICKHOUSE_PASSWORD:platform_dev_ch_password_change_in_prod}
  telemetry:
    consumer:
      enabled: ${PLATFORM_TELEMETRY_CONSUMER_ENABLED:false}
      # max-retries counts total persistence attempts (default 5); backoff-ms defaults to 200.
      # Startup rejects an unsafe complete-poll budget, even when this listener is disabled.
      # Effective Kafka max.poll.interval.ms defaults to 300000; max.poll.records defaults
      # to 1 for this listener only. Explicit larger batches are preserved and validated.
      # Budget: 5000ms poll + records * (attempts * (10000ms HTTP + 1000ms overhead)
      #          + 1000ms record overhead + sum(exponential backoffs) + 5000ms sync ACK).
      # This must be strictly below the poll interval. ACK retries are disabled; any thrown
      # commit failure stops for explicit restart/replay. Values are never silently clamped.
      # Monotonic elapsed-time guards reject late persistence returns before ACK; the overhead
      # allowance is not a hard JVM/OS scheduling guarantee. Stopped listeners remain DOWN.
      # After correcting ERR_KAFKA_POLL_BUDGET, explicitly restart Core/listener; retained
      # records replay from committed offsets (at-least-once; duplicate inserts are possible).
  sensor-control:
    # Development-only enrollment of docker Sensor certs. Must remain false outside local compose.
    dev-bootstrap-enrollment: ${PLATFORM_SENSOR_CONTROL_DEV_BOOTSTRAP_ENROLLMENT:false}
    dev-cert-dir: ${PLATFORM_SENSOR_CONTROL_DEV_CERT_DIR:/certs}
  ingestion:
    kafka:
      # Issue #222: producer hardcodes telemetry.numeric.v1. Do not env-override this
      # independently — IngestionKafkaConfiguration rejects any other configured value.
      topic: telemetry.numeric.v1
  security:
    oidc:
      # Fail-closed resource-server boundary. Leave blank until the deployment IdP issuer is configured.
      # When blank, all bearer JWTs are rejected; Sensor mTLS and health/version routes remain classified separately.
      issuer-uri: ${PLATFORM_OIDC_ISSUER_URI:}
      audience: ${PLATFORM_OIDC_AUDIENCE:}
      provider-instance-id: ${PLATFORM_OIDC_PROVIDER_INSTANCE_ID:platform-oidc}
    directories:
      # Default-off. Production enablement is not authorized by the Issue #249 source draft alone.
      # Flag-off rollback requires restart/reload and restores Empty directories (not schema rollback).
      persistence-enabled: ${PLATFORM_SECURITY_DIRECTORIES_PERSISTENCE_ENABLED:false}
      query-timeout: ${PLATFORM_SECURITY_DIRECTORIES_QUERY_TIMEOUT:2s}
      max-tenant-scopes: ${PLATFORM_SECURITY_DIRECTORIES_MAX_TENANT_SCOPES:256}
      max-permission-grants: ${PLATFORM_SECURITY_DIRECTORIES_MAX_PERMISSION_GRANTS:1024}
      max-named-resources-per-grant: ${PLATFORM_SECURITY_DIRECTORIES_MAX_NAMED_RESOURCES_PER_GRANT:1024}
      # Defensive joined grant/resource row ceiling (not a product capacity claim).
      max-materialized-authority-rows: ${PLATFORM_SECURITY_DIRECTORIES_MAX_MATERIALIZED_AUTHORITY_ROWS:8192}

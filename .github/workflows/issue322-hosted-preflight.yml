# CI-only, source-read-only experiment for Issue #322. No runtime stack provisioned.
name: Issue 322 free hosted runner preflight

on:
  push:
    branches:
      - ci/issue322-hosted-preflight-20261116

permissions:
  contents: read

jobs:
  hosted-capacity:
    name: Ubuntu 24.04 capacity and Docker configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record exact code and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$GITHUB_SHA"
          echo "runner=$RUNNER_OS/$RUNNER_ARCH"
          uname -a
          nproc
          free -m
          df -h
          df -i
          du -sh .
      - name: Docker availability and initial consumption
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker info --format 'Docker root: {{.DockerRootDir}}; Storage driver: {{.Driver}}'
          docker system df
      - name: Render representative Compose profiles without launching containers
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          for profile in dev test ha scale security dr; do
            docker compose --profile "$profile" -f compose.yaml config -q
            docker compose --profile "$profile" -f compose.yaml -f compose.kafka-guarded.yaml config -q
          done
          echo "Referenced images:"
          docker compose --profile dev -f compose.yaml config --images | sort -u
          echo "After source-only preflight:"
          df -h
          docker system df

  hosted-kafka-contract:
    name: Ubuntu 24.04 isolated Kafka storage contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin official Docker Compose to the Kafka deployment contract
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/issue322-docker-cli/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --fail --location --retry 2 --silent --show-error https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 --output "$plugin_dir/docker-compose"
          printf '%s  %s\n' c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b "$plugin_dir/docker-compose" | sha256sum --check --status
          chmod 0755 "$plugin_dir/docker-compose"
          export DOCKER_CONFIG="$RUNNER_TEMP/issue322-docker-cli"
          test "$(docker compose version --short)" = '5.5.0'
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "Pinned version: $(docker compose version --short)"
      - name: Measure disk before test and pull declared fixture images
        shell: bash
        run: |
          set -euo pipefail
          df -h
          docker system df
          docker pull node:20-alpine
          docker pull apache/kafka:3.8.0
          echo "Post-image-pull Docker disk:"
          docker system df
          free_kib="$(df -Pk /var/lib/docker | awk 'NR==2 {print $4}')"
          if (( free_kib < 8 * 1024 * 1024 )); then
            echo "STOP=HOSTED_DISK_BELOW_8_GIB_AFTER_IMAGE_PULL"
            exit 75
          fi
      - name: Verify disposable guarded Kafka storage lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          timeout --signal=TERM --kill-after=30s 20m ./tests/run-kafka-storage-contract-test.sh
      - name: Diagnose task-owned Kafka fixture rejection
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for dir in /tmp/issue223-storage.*; do
            if [[ -d "$dir" ]]; then
              echo "Evidence directory: $dir"
              find "$dir" -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
              for file in "$dir"/legacy-reject.log "$dir"/missing-reject.log "$dir"/auth-reject.log; do
                if [[ -f "$file" ]]; then
                  echo "Task fixture diagnostic: ${file##*/}"
                  tail -n 35 "$file"
                fi
              done
            fi
          done
      - name: Record post-run disk and container inventory
        if: always()
        shell: bash
        run: |
          df -h
          docker system df
          docker ps -a --format '{{.ID}} {{.Names}} {{.Status}}'

  hosted-ui-build:
    name: Ubuntu 24.04 actual UI tests and production image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run unchanged master CI UI commands on isolated hosted runner
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ui:/src:ro" \
            node:20-alpine \
            sh -lc 'cp -a /src /app && cd /app && npm ci && npm run test:unit && npm run build'
          docker build --no-cache -t platform-ui:ci ui/
          docker image inspect platform-ui:ci --format 'Built image ID: {{.Id}}'
      - name: Observe UI build runner disk consumption
        if: always()
        run: |
          df -h
          docker system df

  hosted-static-contracts:
    name: Hosted Ubuntu 24.04 Static contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin official Compose version for identical source contract
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/issue322-docker-cli/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --fail --location --retry 2 --silent --show-error https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 --output "$plugin_dir/docker-compose"
          printf '%s  %s\n' c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b "$plugin_dir/docker-compose" | sha256sum --check --status
          chmod 0755 "$plugin_dir/docker-compose"
          export DOCKER_CONFIG="$RUNNER_TEMP/issue322-docker-cli"
          test "$(docker compose version --short)" = '5.5.0'
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Verify changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git diff --check
          fi

      - name: Prepare deterministic environment
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp .env.example .env
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"

          sed -i "s/^PLATFORM_CORE_HOST_PORT=.*/PLATFORM_CORE_HOST_PORT=21443/" .env
          sed -i "s/^PLATFORM_UI_HOST_PORT=.*/PLATFORM_UI_HOST_PORT=21000/" .env
          sed -i "s/^PLATFORM_POSTGRES_HOST_PORT=.*/PLATFORM_POSTGRES_HOST_PORT=21432/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=.*/PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=21123/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=.*/PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=21900/" .env
          sed -i "s/^PLATFORM_VALKEY_HOST_PORT=.*/PLATFORM_VALKEY_HOST_PORT=21379/" .env
          sed -i "s/^PLATFORM_ENV=.*/PLATFORM_ENV=ci/" .env

          cat <<EOF >> .env
          PLATFORM_PG_DATA_VOLUME=ci_${RUN_IDENTITY}_pg_data
          PLATFORM_CH_DATA_VOLUME=ci_${RUN_IDENTITY}_ch_data
          PLATFORM_KAFKA_DATA_VOLUME=ci_${RUN_IDENTITY}_kafka_data
          PLATFORM_VALKEY_DATA_VOLUME=ci_${RUN_IDENTITY}_valkey_data
          PLATFORM_SENSOR_NET_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_net_spool
          PLATFORM_SENSOR_INFRA_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_infra_spool
          EOF
          sed -i 's/^[[:space:]]*//' .env

          make certs
          docker compose config -q

      - name: Run static contract validators
        run: make test-static-contracts

      - name: Validate agent pack synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -f project_agents/tools/validate_agents.py ]; then
            if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              if git diff --name-only "${BASE_SHA}...HEAD" | grep -qE '^(project_agents/|\.cursor/agents/|\.agents/agents/|\.agents/skills/|\.codex/agents/|skills/)'; then
                python3 project_agents/tools/validate_agents.py
              fi
            else
              python3 project_agents/tools/validate_agents.py
            fi
          fi


  hosted-unit:
    name: Hosted Ubuntu 24.04 Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin official Compose version for identical source contract
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/issue322-docker-cli/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --fail --location --retry 2 --silent --show-error https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64 --output "$plugin_dir/docker-compose"
          printf '%s  %s\n' c57ab918abd5b05ca7e7d0f275875dd1330a695074f309dc9eab1b49efafcd4b "$plugin_dir/docker-compose" | sha256sum --check --status
          chmod 0755 "$plugin_dir/docker-compose"
          export DOCKER_CONFIG="$RUNNER_TEMP/issue322-docker-cli"
          test "$(docker compose version --short)" = '5.5.0'
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Prepare environment
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp .env.example .env
          RUN_IDENTITY="${RUN_ID}_${RUN_ATTEMPT}"

          sed -i "s/^PLATFORM_CORE_HOST_PORT=.*/PLATFORM_CORE_HOST_PORT=21443/" .env
          sed -i "s/^PLATFORM_UI_HOST_PORT=.*/PLATFORM_UI_HOST_PORT=21000/" .env
          sed -i "s/^PLATFORM_POSTGRES_HOST_PORT=.*/PLATFORM_POSTGRES_HOST_PORT=21432/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=.*/PLATFORM_CLICKHOUSE_HTTP_HOST_PORT=21123/" .env
          sed -i "s/^PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=.*/PLATFORM_CLICKHOUSE_NATIVE_HOST_PORT=21900/" .env
          sed -i "s/^PLATFORM_VALKEY_HOST_PORT=.*/PLATFORM_VALKEY_HOST_PORT=21379/" .env
          sed -i "s/^PLATFORM_ENV=.*/PLATFORM_ENV=ci/" .env

          cat <<EOF >> .env
          PLATFORM_PG_DATA_VOLUME=ci_${RUN_IDENTITY}_pg_data
          PLATFORM_CH_DATA_VOLUME=ci_${RUN_IDENTITY}_ch_data
          PLATFORM_KAFKA_DATA_VOLUME=ci_${RUN_IDENTITY}_kafka_data
          PLATFORM_VALKEY_DATA_VOLUME=ci_${RUN_IDENTITY}_valkey_data
          PLATFORM_SENSOR_NET_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_net_spool
          PLATFORM_SENSOR_INFRA_SPOOL_VOLUME=ci_${RUN_IDENTITY}_sensor_infra_spool
          EOF
          sed -i 's/^[[:space:]]*//' .env

          mkdir -p "${HOME}/.m2"

      - name: Run containerized unit tests
        run: make test-unit

      - name: Run Engineering Orchestrator Phase 1 tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/engineering_orchestrator/run_tests.py

